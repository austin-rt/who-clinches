name: Enforce source branch

on:
  pull_request:
    branches: [main]

# gh pr close --comment needs pull-requests: write. Without this the job inherits
# the repo default (contents/metadata/packages: read) and dies on
# "Resource not accessible by integration (addComment)", so the guard fails loudly
# instead of quietly closing the PR it exists to close.
permissions:
  pull-requests: write

jobs:
  check-source:
    runs-on: ubuntu-latest
    steps:
      - name: Close PR and comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr close ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --comment "PRs to main are not accepted. This branch is updated via direct push from develop."
